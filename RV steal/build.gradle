plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'ru.rvsteal'
base { archivesName = 'killerkc2-client' }
repositories { }
dependencies {
    testImplementation "junit:junit:4.13.2"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java { withSourcesJar() }

// Bundle only our distributable and the declared Fabric API in the Windows installer.
tasks.register('launcherAssets') {
    dependsOn tasks.named('remapJar')
    doLast {
        copy {
            from tasks.named('remapJar').get().archiveFile
            into 'launcher/assets'
            rename { 'killerkc2-client.jar' }
        }
        def api = configurations.modImplementation.files.find { it.name == "fabric-api-${project.fabric_api_version}.jar" }
        if (api == null) throw new GradleException('Fabric API artifact not found')
        copy { from api; into 'launcher/assets'; rename { 'fabric-api-killerkc2.jar' } }
    }
}
