name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: unzip -q marketbot-mod.zip
      - name: Build
        working-directory: marketbot-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon < <(yes)
      - uses: actions/upload-artifact@v4
        with:
          name: marketbot-jar
          path: |
            marketbot-mod/build/libs/*.jar
            !marketbot-mod/build/libs/*-sources.jar
